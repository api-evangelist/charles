reviews:
  - date: '2026-06-03'
    rating: 2
    summary: >-
      Charles University has no central developer portal or open API program.
      Confirmed live public interfaces are standards-based academic
      infrastructure: two DSpace OAI-PMH metadata endpoints (Digital Repository
      and Research Publications Repository), both returning HTTP 200 with valid
      OAI-PMH 2.0 Identify responses, and the LINDAT/CLARIAH-CZ NLP web services
      (Machine Translation REST API and NameTag NER REST API) operated by the
      UFAL institute, both with public documentation. Student-facing systems
      (SIS, course catalogue/timetable) and SSO are gated behind eduID.cz /
      Shibboleth SAML and expose no documented open API. The UKUK-Repository-Dept
      GitHub org hosts DSpace/Alma integration tooling. No endpoints were
      fabricated; all base URLs below were probed.
    endpoints:
      - url: https://www.cuni.cz/UKEN-1.html
        status: 200
        note: Official university website (English).
      - url: https://dspace.cuni.cz/oai/request?verb=Identify
