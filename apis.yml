x-coverage:
  state: covered
  reason: covered
  detail: >-
    Charles University is one of the rare universities with a substantial institution-operated
    programmable footprint, and this profile is a correction of a June 2026 one that both understated
    it and misbased it. Five keyless production REST APIs run on lindat.mff.cuni.cz under UFAL in the
    Faculty of Mathematics and Physics (translation, UDPipe, NameTag, MorphoDiTa, Korektor); all five
    were probed live and returned 200 with real payloads. Three OAI-PMH 2.0 endpoints on
    university-owned hosts answered verb=Identify. The university's own Shibboleth SAML IdP serves
    metadata at idp.cuni.cz. DataCite (CUNI) and Crossref (5727, 55007) memberships were confirmed
    against the registries. UFAL publishes documentation rather than machine-readable contracts for
    four of the five services, so those OpenAPIs are derived and marked as such; only the translation
    API ships its own Swagger 2.0. What is genuinely absent: no central developer portal, no
    open-data portal (data.cuni.cz and opendata.cuni.cz do not resolve), no api.cuni.cz, and no
    public API over the Study Information System — student-facing systems are gated behind
    eduID/Shibboleth. Library discovery is an Ex Libris Primo tenancy and cuni.figshare.com is a
    Figshare tenancy; both relationships are recorded and neither vendor contract is saved here.
    The institution's AI posture is published only in Czech at ai.cuni.cz. Note for pointer
    liveness: the four UFAL service base URLs (.../udpipe/api, /nametag/api, /morphodita/api,
    /korektor/api) return 404 on a bare GET because those services expose no root resource;
    every operation beneath them (/models, /process, /recognize, /tag, /correct) returned 200
    when probed. They are kept because they are the servers[] base the contracts declare.
    The LinkedIn page returns 999 (anti-bot) and cuni.figshare.com returns 202 (AWS WAF
    challenge); both are live, not dead.
