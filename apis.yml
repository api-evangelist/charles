---
aid: charles
name: Charles University
description: >-
  Charles University (Univerzita Karlova), founded in 1348 in Prague, is the
  largest and oldest university in Czechia and is ranked #246 in the QS World
  University Rankings 2025. Its public developer/API footprint is limited and
  primarily academic-infrastructure oriented: institutional DSpace repositories
  expose standards-based OAI-PMH metadata-harvesting endpoints, and the Institute
  of Formal and Applied Linguistics (UFAL, Faculty of Mathematics and Physics)
  operates the LINDAT/CLARIAH-CZ platform which publishes documented public REST
  web services for natural-language processing. Core student-facing systems such
  as the Study Information System (SIS) and single sign-on are gated behind
  eduID.cz / Shibboleth (SAML) authentication and do not publish an open API.
