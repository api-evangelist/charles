aid: charles
name: Charles University
x-type: university
x-category: Public Research University
description: >-
  Charles University (Univerzita Karlova), founded in 1348 in Prague, is the largest and oldest
  university in Czechia. Unusually for a university, a substantial part of its programmable
  footprint is genuinely institution-operated rather than a vendor contract running under its name.
  The Institute of Formal and Applied Linguistics (UFAL) in the Faculty of Mathematics and Physics
  runs the LINDAT/CLARIAH-CZ research infrastructure and publishes five documented, keyless,
  production REST APIs on its own host — machine translation, UDPipe (tokenization, tagging,
  lemmatization and dependency parsing across 961 Universal Dependencies models), NameTag
  (named-entity recognition), MorphoDiTa (morphological analysis and generation) and Korektor
  (Czech spellchecking and diacritics). Three DSpace repositories on university-owned infrastructure
  expose OAI-PMH 2.0, and the LINDAT repository additionally exposes a DSpace 7 HAL REST API. The
  university operates its own Shibboleth SAML identity provider at idp.cuni.cz, registered in the
  Czech national federation eduID.cz, and is a DataCite registrant (CUNI) and Crossref member.
  What it does NOT have is a central developer portal, an open-data portal, or any public API over
  the Study Information System (SIS) or student records — those are gated behind eduID/Shibboleth.
  Library discovery (UKAZ) is an Ex Libris Primo tenancy and cuni.figshare.com is a Figshare
  tenancy; both are real institutional relationships whose contracts belong to the vendors.
